<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espera só mais um pouco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pls-style.css">
</head>
<body>
    <main>
        <p class="eyebrow reveal">Por favor meu amor</p>
        <h1 class="titulo reveal">Espera só mais um pouquinho</h1>

        <figure class="polaroid reveal">
            <img src="heleninha3.jpeg" alt="Helena rindo, escondendo o rosto atrás das mãos">
        </figure>

        <section class="carta reveal">
            <p>Meu bem, eu sei que você tá brava, mas deixa eu te mostrar que eu posso ser melhor, eu juro mesmo, você não tem ideia do quanto eu te amo, de verdade, me perdoa, eu não sei o que eu faço sem você.</p>
        </section>

        <div class="acao reveal">
            <button class="sim" id="btn-sim" type="button">Eu te perdoo mb <span aria-hidden="true">&hearts;</span></button>
        </div>
    </main>
    <script src="pls-fun.js"></script>
</body>
</html>
